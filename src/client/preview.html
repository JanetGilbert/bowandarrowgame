<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenCrossbow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #000;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }
      #preview-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }
      body.preview-test-mode {
        background: #1a1a1a;
      }
      body.preview-test-mode #preview-wrapper {
        width: var(--preview-test-width, 400px);
        height: var(--preview-test-height, 760px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      #preview-container {
        width: 100%;
        height: 100%;
      }
      #play-btn {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 36px;
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        background: #6c3fa0;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s;
      }
      #play-btn:hover { background: #7d4fbf; }
    </style>
  </head>
  <body>
    <div id="preview-wrapper">
      <div id="preview-container"></div>
      <button id="play-btn">Play</button>
    </div>
    <script type="module" src="preview.ts"></script>
    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const testWidth = params.get('testWidth');
      const testHeight = params.get('testHeight');

      const width = testWidth ? Number.parseInt(testWidth, 10) : Number.NaN;
      const height = testHeight ? Number.parseInt(testHeight, 10) : Number.NaN;

      if (Number.isFinite(width) || Number.isFinite(height)) {
        document.body.classList.add('preview-test-mode');
        if (Number.isFinite(width)) {
          document.body.style.setProperty('--preview-test-width', `${width}px`);
        }
        if (Number.isFinite(height)) {
          document.body.style.setProperty('--preview-test-height', `${height}px`);
        }
      }
    </script>
    <script type="module">
      import { requestExpandedMode } from '@devvit/web/client';
      document.getElementById('play-btn').addEventListener('click', async (e) => {
        try {
          await requestExpandedMode(e, 'game');
        } catch (err) {
          console.error('Failed to enter expanded mode:', err);
        }
      });
    </script>
  </body>
</html>
