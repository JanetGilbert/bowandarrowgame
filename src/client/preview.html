<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenCrossbow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1a1a2e;
        font-family: Arial, sans-serif;
      }
      button {
        padding: 16px 48px;
        font-size: 24px;
        font-weight: bold;
        color: #fff;
        background: #6c3fa0;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover { background: #7d4fbf; }
    </style>
  </head>
  <body>
    <button id="play-btn">Play ZenCrossbow</button>
    <script type="module">
      import { requestExpandedMode } from '@devvit/web/client';
      document.getElementById('play-btn').addEventListener('click', async (e) => {
        try {
          await requestExpandedMode(e, 'game');
        } catch (err) {
          console.error('Failed to enter expanded mode:', err);
        }
      });
    </script>
  </body>
</html>
