<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenCrossbow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: #000;
        font-family: Arial, sans-serif;
      }
      #preview-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #preview-container {
        width: 100%;
        height: 100%;
      }
      #play-btn {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 36px;
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        background: #6c3fa0;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s;
      }
      #play-btn:hover { background: #7d4fbf; }
    </style>
  </head>
  <body>
    <div id="preview-wrapper">
      <div id="preview-container"></div>
      <button id="play-btn">Play</button>
    </div>
    <script type="module" src="preview.ts"></script>
    <script type="module">
      import { requestExpandedMode } from '@devvit/web/client';
      document.getElementById('play-btn').addEventListener('click', async (e) => {
        try {
          await requestExpandedMode(e, 'game');
        } catch (err) {
          console.error('Failed to enter expanded mode:', err);
        }
      });
    </script>
  </body>
</html>
